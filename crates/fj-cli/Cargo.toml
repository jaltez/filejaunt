[package]
name = "fj-cli"
version = "0.1.0"
edition = "2024"
description = "filejaunt CLI: send/receive/resume/doctor/verify"
license = "AGPL-3.0-only"

[[bin]]
name = "filejaunt"
path = "src/main.rs"

[dependencies]
fj-protocol = { path = "../fj-protocol" }
fj-webrtc = { path = "../fj-webrtc" }
clap = { version = "4", features = ["derive"] }
# NOTE (dep note, allowed by plan): clap_complete powers the required
# `filejaunt completions <SHELL>` subcommand.
clap_complete = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal", "io-util", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
directories = "6"
# NOTE (dep note, allowed by plan): hidden passphrase prompt (only used when
# stdin is a TTY); piped stdin is read plainly for scripting/tests.
rpassword = "7"
zeroize = "1"
