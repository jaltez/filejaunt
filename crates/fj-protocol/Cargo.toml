[package]
name = "fj-protocol"
version = "0.2.0"
edition = "2024"
description = "filejaunt core protocol: framing, crypto, PAKE, manifest, transfer state machine (sans-IO, pure)"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
spake2 = "0.4"
rand = "0.9"
zeroize = "1"
subtle = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
thiserror = "2"
base64 = "0.22"
hex = "0.4"
# NOTE (dep note, allowed by plan): unicode-normalization is required to implement the
# NFKD passphrase canonicalization mandated by the protocol spec (P1.4). Pure, no_std-capable.
unicode-normalization = "0.1"
# F6: memory-hard KDF for relay room derivation (blocks offline dictionaries)
argon2 = "0.5"

[features]
# F8: test-only helpers (key-material introspection) are compiled out of
# production and third-party builds entirely.
test-util = []

[dev-dependencies]
proptest = "1"
# Self dev-dependency: enables `test-util` for this crate's own integration
# tests (tests/*) without leaking the feature into dependents.
fj-protocol = { path = ".", features = ["test-util"] }

# WASM-only: SystemTime is unavailable on wasm32-unknown-unknown; receipts
# use js_sys::Date for timestamps in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
