[package]
name = "fj-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fj-protocol = { path = "../crates/fj-protocol", features = ["test-util"] }
serde_json = "1"

[lib]
path = "fuzz_targets/lib.rs"

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope_parse"
path = "fuzz_targets/envelope_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decrypt_frame"
path = "fuzz_targets/decrypt_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_ingest"
path = "fuzz_targets/session_ingest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receipt_verify"
path = "fuzz_targets/receipt_verify.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
overflow-checks = true
