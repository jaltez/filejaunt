# cargo-deny configuration

[advisories]
version = 2
yanked = "warn"
ignore = [
  # webrtc-rs internal (bincode for stats); unmaintained, no vulnerability.
  "RUSTSEC-2025-0141",
  # p256/ecdsa (DTLS cert signing) timing variability; ephemeral per-session
  # certs, not on the filejaunt crypto path (SPAKE2/AES-GCM are unaffected).
  "RUSTSEC-2026-0387",
  # transitive pin-utils (unmaintained, no vulnerability)
  "RUSTSEC-2026-0441",
]

[licenses]
version = 2
unused-allowed-license = "warn"
allow = [
  "AGPL-3.0-only",
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
]
